# architect.yaml — space-architect loop routing for this space (pi-port).
# Space-local values override ~/.config/space-architect/architect.yaml (global).
# Model ids are pi provider/model ids; `thinking` is the pi effort level.
# Builder routing follows the owner's standing directive (builders zai/glm-5.3-flash);
# spec/judge carry the strong-reasoning model; the coordinator only tends, so it rides flash.
version: 1
roles:
  architect:
    model: zai/glm-5.3
    thinking: high
  spec:
    model: zai/glm-5.3
    thinking: high
  judge:
    model: zai/glm-5.3
    thinking: high
  builder:
    model: zai/glm-5.3-flash
    thinking: high
  coordinator:
    model: zai/glm-5.3-flash
    thinking: high
  # narrator routing lives in .pi/agents/architect-narrator.md (flash/low,
  # baked in at the I05 rollout): architect-loop.ts's validator knows only the
  # five roles above, and under pi 1.2.0's loader a yaml `narrator` entry
  # fails the whole extension load (2026-10-15).
